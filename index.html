<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>ChibiGachaGotchi</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      :root {
        --game-aspect-width: 9;
        --game-aspect-height: 16;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-container {
        position: relative !important;
        width: min(100vw, calc(100vh * var(--game-aspect-width) / var(--game-aspect-height))) !important;
        height: min(100vh, calc(100vw * var(--game-aspect-height) / var(--game-aspect-width))) !important;
        background: #000;
        overflow: hidden;
      }

      @supports (height: 100dvh) {
        #unity-container {
          width: min(100vw, calc(100dvh * var(--game-aspect-width) / var(--game-aspect-height))) !important;
          height: min(100dvh, calc(100vw * var(--game-aspect-height) / var(--game-aspect-width))) !important;
        }
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #000;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #unity-warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        z-index: 10;
      }

      #unity-footer {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-mobile-safe">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ChibiGachaGotchi</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type == "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type == "warning") {
            div.style = "background: yellow; padding: 10px;";
          }

          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";

      // Change this value when you need to hard-bust browser cache during testing.
      // Safe to leave as-is for normal builds.
      var buildVersion = "0.1.0";

      var loaderUrl = buildUrl + "/ChibiGachaGotchi_WEB_BUILD.loader.js?v=" + buildVersion;

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ChibiGachaGotchi_WEB_BUILD.data.unityweb?v=" + buildVersion,
        frameworkUrl: buildUrl + "/ChibiGachaGotchi_WEB_BUILD.framework.js.unityweb?v=" + buildVersion,
        codeUrl: buildUrl + "/ChibiGachaGotchi_WEB_BUILD.wasm.unityweb?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ChibiGachaGotchi",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      function resizeUnityCanvasToContainer() {
        var canvas = document.querySelector("#unity-canvas");

        if (!canvas) {
          return;
        }

        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener("resize", resizeUnityCanvasToContainer);
      window.addEventListener("orientationchange", resizeUnityCanvasToContainer);
      resizeUnityCanvasToContainer();

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";

          var fullscreenButton = document.querySelector("#unity-fullscreen-button");

          if (fullscreenButton) {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
